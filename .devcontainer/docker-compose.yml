services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/python-aws-lambda-lab:cached
    command: sleep infinity
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lambda_lab
      DB_USER: lambda_lab
      DB_PASSWORD: lambda_lab

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lambda_lab
      POSTGRES_USER: lambda_lab
      POSTGRES_PASSWORD: lambda_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  postgres_data:
